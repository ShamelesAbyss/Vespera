name: Rust foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: CLI configuration smoke test
        run: cargo run --locked -p vespera-app -- validate-config --config config/local.toml --json
      - name: Read-only host diagnostics
        run: cargo run --locked -p vespera-app -- doctor --json

  linux-native:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - name: Strict native Clippy
        run: cargo clippy --locked -p vespera-view --features graphics --all-targets -- -D warnings
      - name: Native desktop tests
        run: cargo test --locked -p vespera-view --features graphics
      - name: Build desktop and launcher
        run: cargo build --locked -p vespera-view --features graphics --bins
      - name: Verify headless startup diagnostic
        shell: bash
        run: |
          status=0
          output=$(env -u DISPLAY target/debug/vespera-view 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fx 'error: An X11 display is required for graphics. Use the vespera CLI for headless operation.' <<< "$output"

  windows-native:
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - name: Strict native Clippy
        run: cargo clippy --locked -p vespera-view --features graphics --all-targets -- -D warnings
      - name: Native desktop tests
        run: cargo test --locked -p vespera-view --features graphics
      - name: Build desktop and launcher resources
        run: cargo build --locked -p vespera-view --features graphics --bins
      - name: Portable packaging tests
        run: cargo test --locked -p vespera-app --example package-local
      - name: Build installer CLI fixture
        run: cargo build --locked -p vespera-app --bin vespera
      - name: Rehearse per-user install, upgrade and restore
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
