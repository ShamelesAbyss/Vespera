name: Optimized Windows installer qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-qualification.yml'
      - 'scripts/test-windows-installer.ps1'
      - 'packaging/windows/**'

permissions:
  contents: read

jobs:
  optimized-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Rehearse optimized clean install, upgrade and rollback
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Optimized
