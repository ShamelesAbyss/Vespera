# Configuration schema v1. This is declared inventory, not a connected system.
# Replace example-local-model with a model actually installed in your provider.
schema_version = 1

[network]
allow_remote = false
allow_insecure_http = false

[resources]
ram_bytes = 4294967296
vram_bytes = 0
max_concurrent_inferences = 1
max_context_tokens = 4096

[[providers]]
id = "11111111-1111-4111-8111-111111111111"
name = "Local Ollama"
kind = "ollama"
endpoint = "http://127.0.0.1:11434"
request_timeout_seconds = 30
# credential_env = "VESPERA_OLLAMA_TOKEN" # Reference only, never a literal token.

[[models]]
id = "22222222-2222-4222-8222-222222222222"
provider_id = "11111111-1111-4111-8111-111111111111"
name = "Example local text model"
identifier = "example-local-model"
capabilities = ["text-generation", "summarization"]
responsibilities = ["summarization"]
availability = "unknown"
# Unknown context/RAM/VRAM metadata is omitted, not asserted to be zero.

[[agents]]
permissions = []
status = "suspended"

[agents.identity]
id = "33333333-3333-4333-8333-333333333333"
name = "Archivist"
role = "Knowledge curator"
description = "A persistent identity independent of its selected inference model."
personality = "Careful and concise"
goals = ["Preserve useful observations with provenance"]

[agents.model_policy]
kind = "fixed"
model_id = "22222222-2222-4222-8222-222222222222"
