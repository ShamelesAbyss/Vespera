[package]
name = "vespera-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Native command-line entry point for the VESPERA foundation"

[[bin]]
name = "vespera"
path = "src/main.rs"

[dependencies]
vespera-core.workspace = true
vespera-api = { path = "../vespera-api" }
vespera-events = { path = "../vespera-events" }
vespera-memory = { path = "../vespera-memory" }
vespera-config.workspace = true
vespera-providers.workspace = true
vespera-model-registry = { path = "../vespera-model-registry" }
vespera-scheduler = { path = "../vespera-scheduler" }
vespera-agents = { path = "../vespera-agents" }
vespera-orchestrator = { path = "../vespera-orchestrator" }
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
reqwest.workspace = true
ring = { version = "0.17", default-features = false }
uuid.workspace = true

[lints]
workspace = true
