[package]
name = "vespera-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
graphics = ["dep:bevy", "dep:clap", "dep:tokio", "dep:vespera-sdk", "dep:vespera-world"]

[[bin]]
name = "vespera-view"
path = "src/main.rs"
required-features = ["graphics"]

[dependencies]
vespera-core.workspace = true
vespera-sdk = { path = "../vespera-sdk", optional = true }
vespera-world = { path = "../vespera-world", optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font",
    "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_render",
    "bevy_ui", "bevy_ui_render", "bevy_text", "bevy_picking", "mesh_picking",
    "bevy_gizmos", "bevy_gizmos_render",
] }

[lints]
workspace = true
