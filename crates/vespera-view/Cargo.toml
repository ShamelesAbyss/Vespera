[package]
name = "vespera-view"
default-run = "vespera-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
graphics = ["dep:bevy", "dep:clap", "dep:nvml-wrapper", "dep:png", "dep:rusqlite", "dep:serde_json", "dep:sysinfo", "dep:tokio", "dep:vespera-agents", "dep:vespera-app", "dep:vespera-config", "dep:vespera-events", "dep:vespera-orchestrator", "dep:vespera-providers", "dep:vespera-sdk", "dep:vespera-world", "dep:winit", "dep:xkbcommon-dl"]

[[bin]]
name = "vespera-view"
path = "src/main.rs"
required-features = ["graphics"]

[[bin]]
name = "vespera-launcher"
path = "src/launcher.rs"
required-features = ["graphics"]

[dependencies]
vespera-core.workspace = true
vespera-agents = { path = "../vespera-agents", optional = true }
vespera-app = { path = "../vespera-app", optional = true }
vespera-config = { workspace = true, optional = true }
vespera-providers = { workspace = true, optional = true }
vespera-events = { path = "../vespera-events", optional = true }
vespera-orchestrator = { path = "../vespera-orchestrator", optional = true }
vespera-sdk = { path = "../vespera-sdk", optional = true }
vespera-world = { path = "../vespera-world", optional = true }
clap = { workspace = true, optional = true }
png = { version = "=0.17.16", optional = true }
winit = { version = "=0.30.13", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
rusqlite = { version = "=0.41.1", default-features = false, features = ["libsqlite3-sys", "bundled"], optional = true }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"], optional = true }
tokio = { workspace = true, optional = true }
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font", "system_clipboard",
    "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_render",
    "bevy_ui", "bevy_ui_render", "bevy_text", "bevy_picking", "mesh_picking", "ui_picking",
    "bevy_gizmos", "bevy_gizmos_render", "bevy_gltf", "png",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { version = "=0.13.0", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon-dl = { version = "=0.4.2", features = ["x11"], optional = true }

[build-dependencies]
cc = "=1.11.0"

[lints]
workspace = true
